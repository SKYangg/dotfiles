
set -g mouse on

# Allow remote Yazi inline images to pass through tmux.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Use Ctrl-] as the tmux prefix instead of the default Ctrl-b.
unbind C-b
set -g prefix C-]
bind-key C-] send-prefix

if-shell '[ -f "$HOME/.config/kaku/tmux/kaku.tmux.conf" ]' \
  'source-file "$HOME/.config/kaku/tmux/kaku.tmux.conf"'
