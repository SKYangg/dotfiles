[mgr]
ratio = [1, 2, 5]
sort_by = "extension"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "mtime"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll", "drag"]

[preview]
wrap = "yes"
tab_size = 2
max_width = 6000
max_height = 9000
cache_dir = ""
image_delay = 30
image_filter = "lanczos3"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
smoothcsv = [
{ run = "smoothcsv %s", desc = "SmoothCSV", orphan = true, for = "macos" },
]
edit = [
{ run = "vim %s", desc = "Vim", block = true, for = "unix" },
]
open = [
{ run = "open %s", desc = "Open", orphan = true, for = "macos" },
]

[open]
prepend_rules = [
# Text and source files remain editable without MIME detection.
{ url = "*.json", use = "edit" },
{ url = "*.jsonc", use = "edit" },
{ url = "*.ndjson", use = "edit" },
{ url = "*.jsonl", use = "edit" },
{ url = "*.txt", use = "edit" },
{ url = "*.log", use = "edit" },
{ url = "*.md", use = "edit" },
{ url = "*.csv", use = ["smoothcsv", "edit", "open"] },
{ url = "*.tsv", use = ["smoothcsv", "edit", "open"] },
{ url = "*.xlsx", use = "open" },
{ url = "*.yaml", use = "edit" },
{ url = "*.yml", use = "edit" },
{ url = "*.toml", use = "edit" },
{ url = "*.xml", use = "edit" },
{ url = "*.html", use = "edit" },
{ url = "*.css", use = "edit" },
{ url = "*.js", use = "edit" },
{ url = "*.jsx", use = "edit" },
{ url = "*.ts", use = "edit" },
{ url = "*.tsx", use = "edit" },
{ url = "*.rs", use = "edit" },
{ url = "*.go", use = "edit" },
{ url = "*.py", use = "edit" },
{ url = "*.rb", use = "edit" },
{ url = "*.sh", use = "edit" },
{ url = "*.bash", use = "edit" },
{ url = "*.zsh", use = "edit" },
{ url = "*.fish", use = "edit" },
{ url = "*.jl", use = "edit" },
{ url = "*.m", use = "edit" },
{ url = "*.tex", use = "edit" },
{ url = "*.bib", use = "edit" },
{ url = "*.sql", use = "edit" },
{ url = "*.ini", use = "edit" },
{ url = "*.conf", use = "edit" },
{ url = "*.cfg", use = "edit" },
{ url = ".env", use = "edit" },
]

[tasks]
bizarre_retry = 3
image_alloc = 536870912      # 512MB
image_bound = [10000, 10000]

[plugin]
# Resolve MIME from the extension database in Lua; never invoke file(1).
# `fetchers` replaces the built-in list, so the default directory rule must be
# restated here; without `mime.dir` folders get no `folder/*` mime and the
# folder previewer never runs. `mime.dir` is pure Lua and never spawns file(1).
fetchers = [
{ url = "*/", run = "mime.dir", prio = "high", group = "mime" },
{ url = "local://*", run = "mime-ext.local", prio = "high", group = "mime" },
{ url = "remote://*", run = "mime-ext.remote", prio = "high", group = "mime" },
]
preloaders = []
prepend_previewers = [
{ url = "*.csv", run = "duckdb" },
{ url = "*.tsv", run = "duckdb" },
{ url = "*.parquet", run = "duckdb" },
{ url = "*.xlsx", run = "duckdb" },
{ url = "*.db", run = "duckdb" },
{ url = "*.duckdb", run = "duckdb" },
{ url = "*.json", run = 'piper -- bat -p --color=always --paging=never "$1"' },
{ url = "*.jsonc", run = 'piper -- bat -p --color=always --paging=never "$1"' },
{ url = "*.ndjson", run = 'piper -- bat -p --color=always --paging=never "$1"' },
{ url = "*.jsonl", run = 'piper -- bat -p --color=always --paging=never "$1"' },
{ url = "*.txt", run = 'piper -- bat -p --color=always --paging=never "$1"' },
{ url = "*.log", run = 'piper -- bat -p --color=always --paging=never "$1"' },
{ url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
{ url = "*.yaml", run = "code" },
{ url = "*.yml", run = "code" },
{ url = "*.toml", run = "code" },
{ url = "*.xml", run = "code" },
{ url = "*.html", run = "code" },
{ url = "*.css", run = "code" },
{ url = "*.js", run = "code" },
