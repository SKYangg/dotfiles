[mgr]
ratio = [1, 2, 5]
sort_by = "extension"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "mtime"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]
title_format = "Yazi: {cwd}"

[preview]
wrap = "yes"
tab_size = 2
max_width = 6000
max_height = 9000
cache_dir = ""
image_delay = 30
# image_method    = "ueberzug"
image_filter = "lanczos3"
image_protocol = "kitty"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
{ run = '${EDITOR:-vi} "$@"', desc = "$EDITOR", block = true, for = "unix" },
{ run = 'code %*', orphan = true, desc = "code", for = "windows" },
{ run = 'code -w %*', block = true, desc = "code (block)", for = "windows" },
]
open = [
{ run = 'xdg-open "$1"', desc = "Open", for = "linux" },
{ run = 'open "$@"', desc = "Open", for = "macos" },
{ run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
{ run = 'termux-open "$1"', desc = "Open", for = "android" },
]
reveal = [
{ run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "linux" },
{ run = 'open -R "$1"', desc = "Reveal", for = "macos" },
{ run = 'explorer /select,"%1"', orphan = true, desc = "Reveal", for = "windows" },
{ run = 'termux-open "$(dirname "$1")"', desc = "Reveal", for = "android" },
{ run = '''clear; exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
{ run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
{ run = 'ya pub extract --list %*', desc = "Extract here", for = "windows" },
]
play = [
{ run = 'xdg-open "$1"', desc = "Play", for = "linux" },
{ run = 'open "$@"', desc = "Play", for = "macos" },
{ run = 'start "" "%1"', orphan = true, desc = "Play", for = "windows" },
{ run = 'termux-open "$1"', desc = "Play", for = "android" },
{ run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
{ run = 'mediainfo "%1" & pause', block = true, desc = "Show media info", for = "windows" },
]
keynote = [{ run = 'open -a Keynote "$@"', desc = "Keynote", for = "macos" }]
pages = [{ run = 'open -a Pages "$@"', desc = "Pages", for = "macos" }]
numbers = [{ run = 'open -a Numbers "$@"', desc = "Numbers", for = "macos" }]

[open]
rules = [
# Folder
{ url = "*/", use = [
	"edit",
	"open",
	"reveal",
] },
# iWork 文件（放在压缩包规则之前，避免被识别为压缩包）
{ url = "*.key", use = [
	"keynote",
	"open",
	"reveal",
] },
{ url = "*.pages", use = [
	"pages",
	"open",
	"reveal",
] },
{ url = "*.numbers", use = [
	"numbers",
	"open",
	"reveal",
] },
# Text
{ mime = "text/*", use = [
	"edit",
	"reveal",
] },
# Image
{ mime = "image/*", use = [
	"open",
	"reveal",
] },
# Media
{ mime = "{audio,video}/*", use = [
	"play",
	"reveal",
] },
# Archive
{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
	"extract",
	"reveal",
] },
# JSON
{ mime = "application/{json,ndjson}", use = [
	"edit",
	"reveal",
] },
{ mime = "*/javascript", use = [
	"edit",
	"reveal",
] },
# Empty file
{ mime = "inode/empty", use = [
	"edit",
	"reveal",
] },
# Fallback
{ url = "*", use = [
	"open",
	"reveal",
] },
]

[tasks]
micro_workers = 10
macro_workers = 10
bizarre_retry = 3
image_alloc = 536870912      # 512MB
image_bound = [10000, 10000]
suppress_preload = false

[plugin]
prepend_previewers = [
{ url = "*.csv", run = "duckdb" },
{ url = "*.tsv", run = "duckdb" },
{ url = "*.parquet", run = "duckdb" },
{ url = "*.txt", run = "duckdb" },
{ url = "*.xlsx", run = "duckdb" },
{ url = "*.db", run = "duckdb" },
{ url = "*.duckdb", run = "duckdb" },
{ url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' }
]

prepend_preloaders = [
{ url = "*.csv", run = "duckdb", multi = false },
{ url = "*.tsv", run = "duckdb", multi = false },
{ url = "*.parquet", run = "duckdb", multi = false },
{ url = "*.txt", run = "duckdb", multi = false },
{ url = "*.xlsx", run = "duckdb", multi = false },
]
